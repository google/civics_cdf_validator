name: Build and publish CDF validator

on:
  pull_request:
  push:
    branches:
      - master
      - dev
      - staging

jobs:
  build-n-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .
    - name: Test code source
      run: |
        pip install -e ".[test]"
        civics_cdf_validator list
        pytest -v
  ci-status:
    name: ci-status
    needs: [build-n-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Check build and test results
      if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
      env:
        BUILD_RESULT: ${{ needs.build-n-test.result }}
      run: |
        echo "Upstream CI job did not succeed (build-n-test: $BUILD_RESULT)."
        exit 1
  # Source Github Action template
  deploy:
    needs: build-n-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/civics-cdf-validator
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@v2
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.X'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel twine
    - name: Build a binary wheel
      run: |
        python setup.py sdist bdist_wheel
    - name: Publish dist to PyPi
      uses: pypa/gh-action-pypi-publish@release/v1

